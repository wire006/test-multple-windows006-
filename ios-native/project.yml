# XcodeGen 用のプロジェクト定義。
# `brew install xcodegen` 後、このフォルダで `xcodegen generate` すると
# SplitView.xcodeproj が生成され、xcodebuild でビルドできます。
name: SplitView

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  SplitView:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SplitView
        PRODUCT_NAME: SplitView
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "2分割"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # ↓ 実機ビルド時のみ自分の10桁チームIDを設定（またはコマンドで DEVELOPMENT_TEAM=... を渡す）
        # DEVELOPMENT_TEAM: XXXXXXXXXX

schemes:
  SplitView:
    build:
      targets:
        SplitView: all
    run:
      config: Debug
    archive:
      config: Release
